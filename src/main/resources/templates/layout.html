<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Banco del Bienestar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-university"></i> Banco del Bienestar
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">

                    <!-- Enlaces para CLIENTE -->
                    <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                        <a class="nav-link px-3" href="/dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                        <a class="nav-link px-3" href="/transferencias"><i class="fas fa-money-bill-transfer"></i> Transferencias</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                        <a class="nav-link px-3" href="/credito"><i class="fas fa-hand-holding-dollar"></i> Crédito</a>
                    </li>

                    <!-- Enlaces para EJECUTIVO -->
                    <li class="nav-item" sec:authorize="hasRole('EJECUTIVO')">
                        <a class="nav-link px-3" href="/admin"><i class="fas fa-user-tie"></i> Admin</a>
                    </li>

                    <!-- ✅ NUEVO: Enlace al perfil (visible para todos los autenticados) -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link px-3" href="/perfil">
                            <i class="fas fa-user-circle"></i> Mi Perfil
                        </a>
                    </li>

                    <!-- Badge de usuario y logout (solo autenticado) -->
                    <li class="nav-item ms-lg-3 d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                        <div class="user-badge px-3 py-1 rounded-pill bg-dark bg-opacity-25 border border-light">
                            <i class="fa-solid fa-circle-user text-light"></i>
                            <span class="small fw-semibold text-white" sec:authentication="name">Usuario</span>
                            <span class="badge bg-info rounded-pill text-dark text-uppercase ms-1"
                                  th:text="${#authentication.getAuthorities().isEmpty() ? '' : #authentication.getAuthorities().toArray()[0].getAuthority().replace('ROLE_', '')}">
                                ROL
                            </span>
                        </div>
                        <!-- Botón de logout (POST) -->
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill">
                                <i class="fa-solid fa-right-from-bracket"></i> Salir
                            </button>
                        </form>
                    </li>

                    <!-- Login (si no autenticado) -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link px-3" href="/login"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container flex-grow-1 mt-4">
        <div th:replace="${content}"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-light text-center py-3 border-top mt-auto">
        <small>&copy; 2026 Banco del Bienestar</small>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
